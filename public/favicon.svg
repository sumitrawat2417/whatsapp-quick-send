<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  
  <!-- Gradient Definition for a premium look (optional, but applied to stroke/fill) -->
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mirrored Message Bubble Outline -->
  <!-- Tail points to the bottom right (22, 22) -->
  <path d="M16.1 20 A 9 9 0 1 1 20 16.1 L 22 22 Z" stroke="url(#brandGrad)" />
  
  <!-- Solid Zap (Lightning Bolt) in the center -->
  <polygon points="13 6, 7 13, 11.5 13, 11 18, 17 11, 12.5 11" fill="url(#brandGrad)" stroke="none" />
  
</svg>
