<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ensures the app looks good on mobile screens by preventing zoom issues -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/whatsapp-quick-send/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <title>WA Quick Send</title>
  </head>
  <body>
    <!-- This empty div is where React will inject our entire application -->
    <div id="root"></div>
    <!-- This points Vite to our main JavaScript entry file -->
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/whatsapp-quick-send/sw.js')
            .catch(err => console.error('Service worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
